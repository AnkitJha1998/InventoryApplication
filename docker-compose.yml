services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISHED_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployment/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  couchbase:
    image: couchbase:community-7.6.2
    ports:
      - "127.0.0.1:${COUCHBASE_UI_PUBLISHED_PORT:-8091}:8091"
      - "127.0.0.1:${COUCHBASE_QUERY_PUBLISHED_PORT:-8093}:8093"
      - "127.0.0.1:${COUCHBASE_KV_PUBLISHED_PORT:-11210}:11210"
    volumes:
      - couchbase-data:/opt/couchbase/var
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8091/ui/index.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  couchbase-init:
    image: couchbase:community-7.6.2
    depends_on:
      couchbase:
        condition: service_healthy
    environment:
      COUCHBASE_ADMINISTRATOR_USERNAME: ${COUCHBASE_ADMINISTRATOR_USERNAME:-Administrator}
      COUCHBASE_ADMINISTRATOR_PASSWORD: ${COUCHBASE_ADMINISTRATOR_PASSWORD:-password}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-inventory}
      COUCHBASE_SCOPE: ${COUCHBASE_SCOPE:-Inventory}
      COUCHBASE_COLLECTION: ${COUCHBASE_COLLECTION:-InventoryList}
    volumes:
      - ./deployment/couchbase-init.sh:/couchbase-init.sh:ro
    entrypoint: ["/bin/bash", "/couchbase-init.sh"]
    restart: "no"

  kafka:
    image: bitnamilegacy/kafka:3.8.1-debian-12-r2
    ports:
      - "127.0.0.1:${KAFKA_PUBLISHED_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_KRAFT_CLUSTER_ID:-abcdefghijklmnopqrstuv}
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  kafka-init:
    image: bitnamilegacy/kafka:3.8.1-debian-12-r2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./deployment/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]
    restart: "no"

  user-service:
    build:
      context: ./user-service
    environment:
      AZURE_POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory}
      AZURE_DB_USERNAME: ${POSTGRES_USER:-postgres}
      AZURE_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      USER_DB_SCHEMA: ${USER_DB_SCHEMA:-user_service}
    ports:
      - "${USER_SERVICE_PUBLISHED_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    environment:
      AZURE_POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory}
      AZURE_DB_USERNAME: ${POSTGRES_USER:-postgres}
      AZURE_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AZURE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      COUCHBASE_CONNECTION_STRING: couchbase://couchbase
      COUCHBASE_USERNAME: ${COUCHBASE_ADMINISTRATOR_USERNAME:-Administrator}
      COUCHBASE_PASSWORD: ${COUCHBASE_ADMINISTRATOR_PASSWORD:-password}
      COUCHBASE_BUCKET: ${COUCHBASE_BUCKET:-inventory}
      COUCHBASE_SCOPE: ${COUCHBASE_SCOPE:-Inventory}
      COUCHBASE_COLLECTION: ${COUCHBASE_COLLECTION:-InventoryList}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      INVENTORY_DB_SCHEMA: ${INVENTORY_DB_SCHEMA:-inventory_service}
      INVENTORY_QUERY_CONSUMER_GROUP: ${INVENTORY_QUERY_CONSUMER_GROUP:-inventory-query-read-model}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
    ports:
      - "${INVENTORY_SERVICE_PUBLISHED_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      couchbase-init:
        condition: service_completed_successfully
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    environment:
      AZURE_INVENTORY_SERVICE_URL: http://inventory-service:8081
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
    ports:
      - "${ORDER_SERVICE_PUBLISHED_PORT:-8080}:8080"
    depends_on:
      inventory-service:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    environment:
      AZURE_POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventory}
      AZURE_DB_USERNAME: ${POSTGRES_USER:-postgres}
      AZURE_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AZURE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INVENTORY_QUERY_BASE_URL: http://inventory-service:8081
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret}
      NOTIFICATION_DB_SCHEMA: ${NOTIFICATION_DB_SCHEMA:-notification_service}
      NOTIFICATION_CONSUMER_GROUP: ${NOTIFICATION_CONSUMER_GROUP:-notification-consumer}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
    ports:
      - "${NOTIFICATION_SERVICE_PUBLISHED_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      inventory-service:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  couchbase-data:
