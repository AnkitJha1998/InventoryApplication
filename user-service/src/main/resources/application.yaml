server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: user-service
  datasource:
    url: ${AZURE_POSTGRES_URL}
    username: ${AZURE_DB_USERNAME}
    password: ${AZURE_DB_PASSWORD}
  flyway:
    enabled: true
    table: user_service_flyway_schema_history
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600
