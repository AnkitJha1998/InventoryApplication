server:
  port: ${SERVER_PORT:8082}
spring:
  application:
    name: user-service
  datasource:
    url: ${AZURE_POSTGRES_URL}
    username: ${AZURE_DB_USERNAME}
    password: ${AZURE_DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${USER_DB_SCHEMA:user_service}
  flyway:
    enabled: true
    schemas: ${USER_DB_SCHEMA:user_service}
    default-schema: ${USER_DB_SCHEMA:user_service}
    create-schemas: true
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600
