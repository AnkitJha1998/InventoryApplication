server:
  port: ${SERVER_PORT:8082}
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory
    username: postgres
    password: root
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: user_service
  flyway:
    enabled: true
    schemas: user_service
    default-schema: user_service
    create-schemas: true
jwt:
  secret: dev-flow2-signing-secret-change-me
  expiration-seconds: 3600
