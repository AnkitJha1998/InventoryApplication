spring:
  datasource:
    url: jdbc:h2:mem:users;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS user_service
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: user_service
    hibernate:
      ddl-auto: create-drop
jwt:
  secret: test-signing-secret
  expiration-seconds: 3600
